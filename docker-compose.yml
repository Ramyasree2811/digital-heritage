version: '3.8'

services:
  heritage-restorer:
    build: .
    container_name: digital_heritage_restorer
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/outputs:/app/static/outputs
    restart: unless-stopped
